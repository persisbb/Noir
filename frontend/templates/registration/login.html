
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | NOIR</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0A0A0A;
            color: #F0EDE6;
            font-family: Arial, sans-serif;
        }
        .login {
            width: min(340px, 85vw);
            padding: 40px;
            border: 1px solid #B69A70;
            border-radius: 12px;
        }
        h1 {
            color: #B69A70;
            letter-spacing: 5px;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 18px;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #171717;
            border: 1px solid #555;
            border-radius: 5px;
            color: white;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #B69A70;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .error {
            color: #FF9999;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>NOIR</h1>
        <p>Sign in to your document intelligence workspace.</p>

        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">SIGN IN</button>
        </form>
    </main>
</body>
</html>
